# cargo-deny configuration.
# https://embarkstudios.github.io/cargo-deny/checks/cfg.html

[graph]
all-features = false

[advisories]
version = 2
yanked = "warn"
ignore = [
    # RUSTSEC-2026-0253 — "lru: use-after-free due to lack of panic safety
    # in LruCache::pop()". Not reachable here: it needs a key type whose
    # Drop panics, and our only LruCache (TileCache's memory cache) is
    # keyed by TileKey — a Copy struct of u32/i32 with no Drop impl at
    # all. A bump doesn't clear the check either: ratatui-core 0.1.0
    # depends on lru 0.16, so 0.16.4 stays in the tree even with
    # ttymap-engine moved to 0.18. Drop this entry once ratatui ships a
    # lru >= 0.18.2 bump.
    "RUSTSEC-2026-0253",
]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
    "OpenSSL",
]

[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Intra-workspace path deps (`ttymap-engine = { path = ".." }`) read as
# wildcards but are not real version-spec wildcards.
allow-wildcard-paths = true
deny = [
    # Don't ship two copies of TLS stacks in one binary.
    { name = "openssl", deny-multiple-versions = true },
    { name = "openssl-sys", deny-multiple-versions = true },
    { name = "rustls", deny-multiple-versions = true },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
